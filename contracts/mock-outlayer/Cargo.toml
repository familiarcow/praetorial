[package]
name = "mock-outlayer"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
