[package]
name = "escrow"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
# Local-only placeholder (no testnet/mainnet deploy yet); NEP-330
# reproducible-build metadata validation requires a non-empty value.
repository = "https://github.com/praetorial/praetorial"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, per NEP-0330
# https://github.com/near/NEPs/blob/master/neps/nep-0330.md
# Added so wasm hashes can be recorded from `cargo near build
# reproducible-wasm` instead of a plain (non-reproducible) cargo build.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
