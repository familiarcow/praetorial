[package]
name = "praetorial-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
unicode-normalization = "0.1"
unicode_categories = "0.1"
once_cell = "1"
ed25519-dalek = "2"

