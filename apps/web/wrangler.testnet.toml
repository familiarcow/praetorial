# WEBDEP1 (D-WEBDEP1): clickable TESTNET preview of apps/web as a Cloudflare static-assets Worker on workers.dev.
# Free plan, no routes, no custom domain, no secrets. Deploy: `npm run deploy:testnet` (builds with NETWORK_ID=testnet).
# The existing wrangler.toml is the (undeployed) Pages config; this file is separate on purpose.
name = "praetorial-web-testnet"
compatibility_date = "2026-11-04"
workers_dev = true
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/_proxy/*"]
not_found_handling = "single-page-application"

# Same-account Worker-to-Worker calls must use service bindings (workers.dev fetch gives error 1042). Binds only; never deploys these.
[[services]]
binding = "INDEXER"
service = "praetorial-indexer-testnet"

[[services]]
binding = "RELAYER"
service = "praetorial-relayer-testnet"

[[services]]
binding = "REGISTRY"
service = "praetorial-registry-testnet"
