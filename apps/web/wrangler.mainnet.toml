# MAINPREP: MAINNET web as a Cloudflare static-assets Worker. Mirrors wrangler.testnet.toml.
# Deploy: `npm run deploy:mainnet` (build:mainnet -> mainnet guard -> deploy).
# DOM1: served on https://praetorial.com (custom domain); www.praetorial.com is a custom domain too and the Worker 301s it to the apex.
# workers_dev stays on for this release as the rollback path (explicit: wrangler turns it off by default once routes exist);
# flipping it off is a later PM step.
name = "praetorial-web-mainnet"
compatibility_date = "2026-11-04"
workers_dev = true
routes = [{ pattern = "praetorial.com", custom_domain = true }, { pattern = "www.praetorial.com", custom_domain = true }]
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# DOM1: true (not ["/_proxy/*"]) so www.praetorial.com/<any asset path> reaches the redirect in worker/index.ts.
run_worker_first = true
not_found_handling = "single-page-application"

# The proxy (worker/index.ts) on mainnet uses these bindings only; a missing binding is a 502, never a URL fetch.
[vars]
NETWORK_ID = "mainnet"

# Same-account Worker-to-Worker calls must use service bindings (workers.dev fetch gives error 1042). Binds only; never deploys these.
[[services]]
binding = "INDEXER"
service = "praetorial-indexer-mainnet"

[[services]]
binding = "RELAYER"
service = "praetorial-relayer-mainnet"

[[services]]
binding = "REGISTRY"
service = "praetorial-registry-mainnet"
